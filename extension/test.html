<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mizan panel — standalone</title>
  <link rel="stylesheet" href="panel.css">
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle, #e7d9e9 1px, transparent 1px) 0 0 / 18px 18px,
        #f7eeee;
      font-family: "Segoe UI", sans-serif;
    }
    .hint {
      position: fixed;
      top: 16px;
      left: 16px;
      max-width: 260px;
      color: #6b5f66;
      font-size: 13px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <p class="hint">Standalone panel using the sample JSON from CLAUDE.md. Reload the page to replay the flow from the teaser.</p>
  <div id="mount"></div>
  <script src="panel.js"></script>
  <script>
    MizanPanel.mount(document.getElementById("mount"), { standalone: true, cssUrl: "panel.css" });
    MizanPanel.showTeaser({
      onRun: () => {
        MizanPanel.showLoading();
        setTimeout(() => {
          MizanPanel.renderResults(MizanPanel.SAMPLE_ANALYSIS, {
            originalPrompt: MizanPanel.SAMPLE_ORIGINAL_PROMPT,
          });
        }, 1800);
      },
    });
  </script>
</body>
</html>
